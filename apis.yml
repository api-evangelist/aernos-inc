x-domain-note: >-
  aernos.com is still registered to the company (Network Solutions, created 2016-08-29, updated
  2026-06-30, expires 2027-08-29) and its zone still answers NS (pdns13/pdns14.domaincontrol.com)
  and MX (aernos-com.mail.protection.outlook.com), but there is NO A record on the apex or on www,
  so no HTTP request can reach the site. The last Internet Archive capture of https://www.aernos.com/
  is 2025-02-15. The product domain aerband.com shares the same nameservers and resolves to
  52.38.151.165 (AWS us-west-2) but TCP 80 and 443 are both closed. The domain has NOT been
  re-registered by a third party — it is still the company's — so it remains wired as the Website
  pointer, but it is recorded here as unreachable. See well-known/aernos-inc-well-known.yml.
