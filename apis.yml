aid: aernos-inc
name: AerNos
description: >-
  AerNos, Inc. is a San Diego, California nanotechnology company founded in 2016 by Sundip Doshi
  that develops application-specific nano gas sensor modules capable of detecting multiple harmful
  gases — carbon monoxide, ozone, formaldehyde, nitrogen oxides and other volatile organic compounds
  — at parts-per-billion concentrations. Its proprietary AerCNT / AerN2S technology combines
  multi-layer hybrid nanostructures, materials science, nanoengineering and predictive analytics into
  low-power sensor systems intended for plug-and-play integration into third-party smart products.
  Product lines announced between 2017 and 2021 include AerIoT (an IoT nano gas sensor module and
  development kit, a CES 2019 Innovation Award Honoree), AerBand (a wearable research unit), AerHome
  and AerCity (smart-home and smart-city air quality monitors) and SmartAer (a monitoring solution for
  commercial buildings, industrial sites and schools). Frost & Sullivan named AerNos its 2018 Global
  Gas Sensor Industry Entrepreneurial Company of the Year. AerNos is a hardware company that never
  operated a developer program: across its entire published and archived web surface the only mention
  of an API is a single marketing clause on the products page — "organizational access to data via the
  AerBand Data Cloud Auto API" — with no developer portal, API reference, base URL, authentication
  documentation or machine-readable specification of any kind, and its cloud offering was sold as a
  $12/year WooCommerce "Annual Subscription to Cloud Data Services" rather than as a metered developer
  product. Its GitHub organization contains only forks of third-party projects. As of September 2026
  the company's public web presence is dark — aernos.com serves nameserver and Microsoft 365 mail
  records but no address record, and aerband.com resolves to an AWS address with no listening web port.
